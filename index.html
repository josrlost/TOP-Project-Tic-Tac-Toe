<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <script src="script/script.js" defer></script>
    <title>TOP Project: Tic Tac Toe</title>
</head>
<body>
    <div id="ticTacToe">
        <div id="firstColumn">
            <div id="firstCell"></div>
            <div id="secondCell"></div>
            <div id="thirdCell"></div>
        </div>
        <div id="secondColumn">
            <div id="fourthCell"></div>
            <div id="fifthCell"></div>
            <div id="sixthCell"></div>
        </div>
        <div id="thirdColumn">
            <div id="seventhCell"></div>
            <div id="eigthCell"></div>
            <div id="ninethCell"></div>
        </div>
    </div>
    <div id="btns">
        <div><button id="createPlayerBtn">Create Player</button></div>
        <div><button id="modifyPlayerBtn">Modify Player</button></div>
        <div><button id="restartGameBtn">Restart</button></div>
    </div>
    <div id="informationalBar">
        <div id="informationalBarContent">
            <div id="player1">
                <p id="paraPlayer1Title">Player1</p>
                <p id="player1PointParagraph">Points: -</p>
            </div>
            <div id="fiveRounds">
                <p>Five rounds</p>
                <div>
                    <ul id="fiveRoundsList">
                        <li> - </li>
                        <li> </li>
                        <li> </li>
                    </ul>
                </div>
            </div>
            <div id="player2">
                <p id="paraPlayer2Title">Player 2</p>
                <p id="player2PointParagraph">Points: -</p>
            </div>
        </div>
    </div>
    <dialog id="createPlayerDialog">
        <form>
            <label for="playerName">Player Name</label>
            <input type="text" id="playerName" required placeholder="Write a name">
            <fieldset>
                <legend>Player Number</legend>
                <label for="playerOne">Player 1</label>
                <input type="radio" id="playerOne" required name="playerName" value="player1">
                <label for="playerTwo">Player 2</label>
                <input type="radio" id="playerTwo" name="playerName" value="player2">
            </fieldset>
            <div>
                <button type="submit" id="submitBtnCreate">Create</button>
                <button type="button" class="closeBtn">Close</button>
            </div>        
        </form>
    </dialog>
    <dialog id="modifyPlayerDialog">
        <form>
            <label for="playerName">Player Name</label>
            <input type="text" id="playerName" required placeholder="Write a name">
            <fieldset>
                <legend>Player Number</legend>
                <label for="playerOne">Player 1</label>
                <input type="radio" id="playerOne" required>
                <label for="playerTwo">Player 2</label>
                <input type="radio" id="playerTwo" required>
            </fieldset>
            <div>
                <button type="submit" id="submitBtnModify">Modify</button>
                <button type="button" class="closeBtn">Close</button>
            </div>
        </form>
    </dialog>
</body>
</html>
